<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechCart - Login</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">

</head>

<body>
    <div id="header-placeholder"></div>
    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Enter your credentials to access your account</p>
            </div>
            <form id="loginForm" onsubmit="event.preventDefault();">
                <div class="form-group"><input type="email" id="email" class="form-control" placeholder=" "
                        required><svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor"
                        stroke-width="2" viewBox="0 0 24 24">
                        <path
                            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg><label for="email" class="floating-label">Email Address</label></div>

                <div class="form-group"><input type="password" id="password" class="form-control" placeholder=" "
                        required><svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor"
                        stroke-width="2" viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0110 0v4" />
                    </svg><label for="password" class="floating-label">Password</label>
                    <button type="button" class="password-toggle" id="togglePassword"
                        aria-label="Toggle password visibility">
                        <svg id="eyeIcon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg></button>
                </div><button type="submit" class="btn-primary">Sign In</button>
            </form>
            <div class="auth-footer">Don't have an account?
                <a href="register.html">Register</a>
            </div>
        </div>
    </main>

    <script src="/js/login.js"></script>

</body>

</html>
